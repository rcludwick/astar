[general]
bindport = 4569
bindaddr = 0.0.0.0
disallow = all
allow    = ulaw
allow    = gsm
; slin enabled for the iax-31f7 byte-order/echo verification (and future
; slin parity scenarios). Listed after ulaw so the server still prefers ulaw.
allow    = slin
; slin16 for the iax-4348 wideband verification, same ordering rationale.
allow    = slin16
; Skip CALLTOKEN for clients on any network so the no-token peer
; (astartest_notok) flow is deterministic. Per-peer requirecalltoken
; still applies for known peers.
calltokenoptional = 0.0.0.0/0

[astartest]
type             = friend
secret           = supersecret
context          = astar-router
host             = dynamic
requirecalltoken = yes

[astartest_notok]
type             = friend
secret           = supersecret
context          = astar-router
host             = dynamic
requirecalltoken = no
