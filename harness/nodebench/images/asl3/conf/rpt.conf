; nodebench: rpt.conf for node 1999. Derived from the stock asl3-asterisk-config
; 2:22.10.1+asl3-3.10.5 template, comments stripped. Bench changes are marked
; "nodebench:". No radio: the rxchannel is a USRP endpoint on 127.0.0.1 that
; the bench drives.
[general]
; nodebench: [nodes] below, then the external file only. Never AllStar DNS.
node_lookup_method = file
[nodes]
1999 = radio@127.0.0.1:4569/1999,NONE
; nodebench: astar-server listens on 4570 in the same pod (asterisk owns 4569).
1998 = radio@127.0.0.1:4570/1998,NONE
[node-main](!)
rxchannel = Local/pseudo
duplex = 2
linktolink = no
linkmongain = -22
erxgain = -3
etxgain = 3
controlstates = controlstates
events = events
functions = functions
link_functions = functions
morse = morse
phone_functions = functions
scheduler = schedule
telemetry = telemetry
wait_times = wait-times
context = radio
callerid = "Repeater" <0000000000>
accountcode = RADIO
hangtime = 2000
althangtime = 4000
totime = 180000
time_out_reset_unkey_interval = 0
time_out_reset_kerchunk_interval = 250
idrecording = |iNOTSET
idtime = 540000
politeid = 30000
unlinkedct = ct2
remotect = ct3
linkunkeyct = ct8
holdofftelem = 0
telemnomdb = -3
telemduckdb = -15
telemdefault = 2
telemdynamic = yes
parrot = 0
parrottime = 1000
[functions-main](!)
1 = ilink,1
2 = ilink,2
3 = ilink,3
4 = ilink,4
70 = ilink,5
99 = cop,6
5 = macro
721 = status,1
722 = status,2
723 = status,3
724 = status,4
725 = status,5
711 = status,11
712 = status,12
713 = status,13
714 = status,14
[functions](functions-main)
[telemetry-main](!)
ct1 = |t(350,0,100,2048)(500,0,100,2048)(660,0,100,2048)
ct2 = |t(660,880,150,2048)
ct3 = |t(440,0,150,4096)
ct4 = |t(550,0,150,2048)
ct5 = |t(660,0,150,2048)
ct6 = |t(880,0,150,2048)
ct7 = |t(660,440,150,2048)
ct8 = |t(700,1100,150,2048)
ct9 = |t(1633,0,50,1000)(0,0,30,0)(1209,0,50,1000)
remotemon = |t(1209,0,50,2048)
remotetx = |t(1633,0,50,3000)(0,0,80,0)(1209,0,50,3000)
cmdmode = |t(900,903,200,2048)
functcomplete = |t(1000,0,100,2048)(0,0,100,0)(1000,0,100,2048)
remcomplete = |t(650,0,100,2048)(0,0,100,0)(650,0,100,2048)(0,0,100,0)(650,0,100,2048)
pfxtone = |t(350,440,30000,3072)
patchup = rpt/callproceeding
patchdown = rpt/callterminated
[telemetry](telemetry-main)
[morse-main](!)
speed = 20
frequency = 800
amplitude = 4096
idfrequency = 1065
idamplitude = 1024
[morse](morse-main)
[wait-times-main](!)
telemwait = 2000
idwait = 500
unkeywait = 2000
calltermwait = 2000
[wait-times](wait-times-main)
[wait-times_hd]
telemwait = 100
idwait = 100
unkeywait = 100
calltermwait = 2000
[memory]
[macro]
[events-main](!)
[events](events-main)
[controlstates]
0 = rptena,lnkena,apena,totena,ufena,noicd
1 = rptena,lnkena,apdis,totdis,ufena,noice
2 = rptena,lnkdis,apdis,totena,ufdis,noice
[schedule]
[1999](node-main)
; nodebench: the USRP probe is the bench. USRP/<host>:<txport>:<rxport>: chan_usrp
; binds 127.0.0.1:32001 for the radio's audio and sends its own to 127.0.0.1:34001.
rxchannel = USRP/127.0.0.1:34001:32001
