; nodebench: extensions.conf for node 1999. Only the node-to-node path is
; kept from the stock ASL3 dialplan; nothing here reaches the internet
; (the stock [allstar-public] context, which calls register.allstarlink.org,
; and [my-ip], which calls myip.vg, are dropped).

[general]
static = yes
writeprotect = yes

[globals]
TAILFILEINDEX=0

[default]
exten => i,1,Hangup

[radio-secure]
exten => _XXXX!,1,Set(NODENUM=${CALLERID(num)})
	same => n,NoOp(Connect from node ${NODENUM} to node ${EXTEN} using ${CHANNEL(channeltype)} from ${CHANNEL(peerip)})
	same => n,ExecIf($[!${RPT_NODE(${EXTEN},exists)}]?Hangup)
	; nodebench workaround, OFF by default (rig.sh up --fill-callerid, or at
	; run time `dialplan set global NODEBENCH_FILL_CALLERID 1`): app_rpt
	; refuses a link whose caller ID is not numeric, and astar-server's link
	; NEW carries no CALLING NUMBER. This fills it in for 1998 only, so the
	; rest of a server-dialled link can be exercised. See RIG.md findings.
	same => n,ExecIf($["${NODENUM}" = "" & ("${ENV(NODEBENCH_FILL_CALLERID)}" = "1" | "${GLOBAL(NODEBENCH_FILL_CALLERID)}" = "1") & "${CUT(CUT(CHANNEL(name),/,2),-,1)}" = "1998"]?Set(CALLERID(num)=1998))
	same => n,Rpt(${EXTEN})
	same => n,Hangup

[radio]
exten => i,1,Hangup

[telemetry]
exten => TIME,1,Playback(rpt/thetimeis)
	same => n,SayUnixTime(RPT_TELEM_TIME(),,IMp)
	same => n,Hangup()
