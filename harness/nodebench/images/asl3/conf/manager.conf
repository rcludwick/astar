; nodebench: AMI on 5038, published on the host's 127.0.0.1 only. Binds 0.0.0.0
; inside the pod so that published port reaches it. Test-only credentials:
; nothing outside the podman VM can reach this, so they guard nothing real.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[nodebench]
secret = nodebench-loopback-only
read = all,system,call,log,verbose,command,agent,user,config
write = all,system,call,log,verbose,command,agent,user,config
