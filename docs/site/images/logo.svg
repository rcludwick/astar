<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Rainbow menu-bar asterisk for the IDLE state (astar-cdab, replaces the
       star): the brand asterisk — six rounded spokes, one point up, NO
       background, transparent — filled with the app-icon rainbow gradient so
       the idle item matches the brand. A non-template colour image (not
       system-tinted); the coloured TX/RX/connected states tint this same
       geometry solid (StatusItemController / gui-rs icons.rs), so the item
       never changes size between states (astar-3f57).
       The asterisk nearly fills the viewBox (radius 470 vs the app icon's 400)
       and its spokes are a touch heavier (width 200 vs the proportional 176)
       so it stays legible at the 18-20pt menu-bar/tray display size. -->
  <defs>
    <!-- full-spectrum rainbow, axis tilted 22.5 deg above horizontal, fitted to
         this (enlarged) asterisk's extent so red and violet land on the mark
         (mirrors the app icon's gradient sequence/direction) -->
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse"
                    x1="129.5" y1="670.4" x2="894.5" y2="353.6">
      <stop offset="0.00" stop-color="#FF1A33"/>
      <stop offset="0.17" stop-color="#FF8000"/>
      <stop offset="0.34" stop-color="#FFE000"/>
      <stop offset="0.51" stop-color="#14E04A"/>
      <stop offset="0.68" stop-color="#00B4FF"/>
      <stop offset="0.84" stop-color="#5B4BFF"/>
      <stop offset="1.00" stop-color="#C03BFF"/>
    </linearGradient>
    <!-- mask: white reveals the asterisk (single gradient wash across the whole
         mark — see art/icon.svg): three capsules rotated 0/60/120 deg about
         centre, radius 470, bar width 200 -->
    <mask id="asteriskMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="#000000"/>
      <g fill="#ffffff">
        <rect x="412" y="42" width="200" height="940" rx="100"/>
        <rect x="412" y="42" width="200" height="940" rx="100" transform="rotate(60 512 512)"/>
        <rect x="412" y="42" width="200" height="940" rx="100" transform="rotate(120 512 512)"/>
      </g>
    </mask>
  </defs>

  <!-- rainbow asterisk (transparent background) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#rainbow)" mask="url(#asteriskMask)"/>
</svg>
