[package]
name = "astar-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Thread-safe IAX2 station facade: console session + audio + PTT + ASL3 WT-connect behind a poll/snapshot API."

[lints]
workspace = true

[dependencies]
# `serde` on astar-iax so the secret-free LinkRoster serializes to JSON for
# the link C-ABI (iax-1075).
astar-iax = { path = "../astar-iax", version = "0.1.11-beta", features = ["serde"] }
astar-iax-core = { path = "../astar-iax-core", version = "0.1.11-beta" }
# `default-features = false`: astar-console's own default pulls in its
# `m17` feature. This crate mirrors that default via its OWN `m17` feature
# below (`m17 = ["astar-console/m17"]`) so `--no-default-features` on
# THIS crate actually disables M17 end-to-end, instead of astar-console
# silently building with it anyway.
astar-console = { path = "../astar-console", version = "0.1.11-beta", default-features = false }
# In-band DTMF tone generator (iax-68eb) for `Station::send_dtmf`.
astar-codec = { path = "../astar-codec", version = "0.1.11-beta" }
# `serde` so the secret-free MicProfile serializes to JSON for the
# characterize / set-mic-profile FFI (iax-5fb6 / iax-2095).
astar-audio = { path = "../astar-audio", version = "0.1.11-beta", features = ["serde"] }
astar-asl3 = { path = "../astar-asl3", version = "0.1.11-beta" }
# DMR's network taxonomy (iax-d4f7): `DmrNetwork::from_slug`, `dialable` and
# `Timeslot`. NOT optional and NOT behind the `dmr` feature, unlike every
# other network's protocol crate here — `Station::dmr_connect` resolves the
# system slug, runs the BrandMeister consent gate and maps the timeslot
# BEFORE its `#[cfg]` block, so those refusals hold identically with the
# feature off. A crate that carries a taxonomy plus one `sha2` is cheap
# enough to compile either way; a consent gate that only exists in some
# builds is not.
astar-dmr = { path = "../astar-dmr", version = "0.1.11-beta" }

[dev-dependencies]
astar-audio = { path = "../astar-audio", version = "0.1.11-beta", features = ["test-backend", "serde"] }
astar-iax-core = { path = "../astar-iax-core", version = "0.1.11-beta" }
# Forces the LGPL `codec2-static` backend on for every TEST/bench build of
# this crate (mirrors astar-console's own dev-dependency override — see
# that crate's Cargo.toml for the full licensing note) so the M17 station
# tests always have a working Codec 2 instance without depending on a system
# libcodec2 being installed. Never part of any default feature set.
astar-codec = { path = "../astar-codec", version = "0.1.11-beta", features = ["codec2-static"] }
# M17 wire-frame parsing (StreamPacket/decode_callsign) for the m17_station
# test's PTT-frame assertion.
astar-m17 = { path = "../astar-m17", version = "0.1.11-beta" }
# D-Star DSVT/RfHeader framing (iax-a9d4 Task 6) for the dstar_station test's
# canned-stream fixtures. Zero dependencies of its own (pure decode/encode +
# a loopback reflector), so — unlike the AMBE codec deps — this is always
# cheap to compile in as a dev-dependency, regardless of `--features dstar`.
astar-dstar = { path = "../astar-dstar", version = "0.1.11-beta" }
tiny_http = "0.12"

[features]
default = ["m17"]
# M17 digital-voice client (iax-f2b8 Task 4): re-exposes astar-console's
# `m17` feature, wired through `Station::m17_connect`/`m17_disconnect`/
# `m17_available`. Byte-identical defaults with this feature off: the methods
# still exist (so downstream code doesn't need its own `#[cfg]`) but return
# `StationError::M17("m17 support not compiled")` / are no-ops / return
# `false`.
m17 = ["astar-console/m17"]
# D-Star (DExtra) full-transceive digital-voice client (iax-a9d4 Task 6
# built RX; iax-2f6b added TX): re-exposes astar-console's `dstar`
# feature, wired through
# `Station::dstar_connect`/`dstar_disconnect`/`dstar_available`. Unlike
# `m17`, this is NOT in `default` — the AMBE vocoder deps are pinned `git`
# dependencies (see `astar_codec::ambe`'s module doc), so opting in is
# explicit. D-Star is hardware-only (iax-b3e7 M0): `dstar` pulls
# `astar-console/dstar`, which in turn depends on `astar-codec/
# ambe-hw` (the `ThumbDV` USB dongle) — no software-codec fallback, no
# preference knob. `dstar_connect` opens the dongle unconditionally.
# Byte-identical defaults with this feature off, same contract as `m17`
# above (methods exist, return `StationError::Dstar("dstar support not
# compiled")` / are no-ops / return `false`).
dstar = ["astar-console/dstar"]
# System Fusion (astar-e7b3 §2): re-exposes astar-console's `ysf` feature,
# wired through `Station::ysf_connect`/`ysf_disconnect`/`ysf_available`/
# `ysf_state`. Not in `default`, for the same reason `dstar` is not: YSF
# voice is AMBE+2 and needs the same `ThumbDV`, so this pulls
# `astar-console/ysf` and through it `astar-codec/ambe-hw`. Receive only —
# there is no transmit path (see `astar_console::ysf`'s module docs).
# Byte-identical defaults with the feature off, same contract as `dstar`:
# the methods exist, and return `StationError::Ysf("ysf support not
# compiled")` / are no-ops / return `false`.
ysf = ["astar-console/ysf"]
# NXDN (iax-b9c2): re-exposes astar-console's `nxdn` feature, wired through
# `Station::nxdn_connect`/`nxdn_disconnect`/`nxdn_available`/`nxdn_state`.
# Not in `default`, for the same reason `ysf` is not: NXDN voice is AMBE+2 —
# the same 49-bit frame and the same RATEP word YSF DN uses — so this pulls
# `astar-console/nxdn` and through it `astar-codec/ambe-hw`. Receive only:
# `set_ptt` refuses a key-down while an NXDN link is live (see
# `astar_console::nxdn`'s module docs). Byte-identical defaults with the
# feature off, same contract as `ysf`: the methods exist, and return
# `StationError::Nxdn("nxdn support not compiled")` / are no-ops / return
# `false`.
nxdn = ["astar-console/nxdn"]
# DMR (iax-d4f7): re-exposes astar-console's `dmr` feature, wired through
# `Station::dmr_connect`/`dmr_disconnect`/`dmr_available`/`dmr_state`. Not in
# `default`, for the same reason `nxdn` is not: DMR voice is AMBE+2 — 72 bits
# at its own rate word — so this pulls `astar-console/dmr` and through it
# `astar-codec/ambe-hw`. Receive only: `set_ptt` refuses a key-down while a
# DMR link is live (see `astar_console::dmr`'s Transmit section).
# Byte-identical defaults with the feature off, same contract as `nxdn`: the
# methods exist, and return `StationError::Dmr("dmr support not compiled")` /
# are no-ops / return `false`. Note what this feature does NOT gate — the
# system-slug resolution, the BrandMeister consent gate and the argument
# refusals all run either way, off the unconditional `astar-dmr` dependency
# above.
dmr = ["astar-console/dmr"]
# Link Codec 2 into the binary instead of relying on a system libcodec2 found
# at runtime (astar-8c4d). NOT default, and it must never become one — see the
# licensing note in `astar-codec/Cargo.toml`. The shipped macOS app turns this
# on explicitly in `bindings/swift/build-xcframework.sh`, because M17 on a Mac
# with no Homebrew libcodec2 is otherwise dead: `open_codec2` tries the runtime
# backend first and falls back to this one, so enabling both means a user with
# the C library still gets it and everyone else gets a working M17 anyway.
codec2-static = ["astar-console/codec2-static"]
