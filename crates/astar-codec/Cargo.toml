[package]
name = "astar-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Audio codecs for astar: G.711 mu-law/A-law and signed-linear for IAX2, Codec 2 for M17, AMBE via ThumbDV."

[lints]
workspace = true

[dependencies]
# System Fusion protocol primitives (iax-e8a4). `astar-ysf` is pure `std` —
# no I/O, no third-party crates — so this costs nothing at build time and
# raises no licensing question, and it is deliberately NOT behind a feature:
# `just ci` builds default features only, and the YSF frame packing in
# `ysf.rs` is the one piece of this crate whose byte layout was read out of
# other people's implementations. That is exactly the code that must be
# under test on every run, not behind a flag nobody turns on.
astar-ysf = { path = "../astar-ysf" }
# NXDN protocol primitives (iax-nxdn). Same reasoning as `astar-ysf` above,
# and the same conclusion: pure `std`, no third-party crates, no licensing
# question, and deliberately NOT behind a feature. The bit layout in
# `nxdn.rs` — two 49-bit AMBE+2 frames per 14-byte block, at bit offsets 0
# and 49 — was read out of other people's implementations, so it is exactly
# the code that must be under test on every `just ci` run.
astar-nxdn = { path = "../astar-nxdn", version = "0.1.12-beta" }
# DMR protocol primitives. Same reasoning as `astar-ysf` and `astar-nxdn`
# above: pure protocol, no licensing question, and deliberately NOT behind a
# feature. `dmr.rs`'s rate word and 72-bit frame layout were read out of
# other people's implementations, and getting either wrong is silent — the
# AMBE-3000 answers a wrongly-configured link with confident noise rather
# than an error — so that byte layout must be under test on every `just ci`
# run, not behind a flag nobody turns on.
astar-dmr = { path = "../astar-dmr", version = "0.1.12-beta" }
thiserror = { workspace = true }
tracing = { workspace = true }
codec2 = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
# Vendored MIT/Apache-2.0 ThumbDV driver — see vendor/ambe-thumbdv/VENDORED.md.
ambe-thumbdv = { path = "../../vendor/ambe-thumbdv", optional = true }

[features]
default = ["g711"]
g711 = []
gsm = []
speex = []
ilbc = []
# LICENSING: `codec2` is LGPL-2.1-only AND MIT. It must stay behind this
# feature and this feature must NEVER be part of any default feature set —
# that's what keeps a plain `cargo build -p astar-codec` (and anything
# depending on this crate with defaults) free of LGPL code. Verify with
# `cargo tree -p astar-codec` (must NOT show codec2/libloading) vs
# `cargo tree -p astar-codec --features codec2-static,codec2-runtime`.
codec2-static = ["dep:codec2"]
codec2-runtime = ["dep:libloading"]
# AMBE vocoder backend (iax-a9d4): the ThumbDV dongle. OFF by default, like
# codec2-*: a plain `cargo build` must never pull the vocoder driver. D-Star
# is hardware-only — there is no software AMBE backend. Verify with
# `cargo tree -p astar-codec` (no ambe-thumbdv) vs `--features ambe-hw`.
ambe-hw = ["dep:ambe-thumbdv"]
