language = "C"
include_guard = "ASTARSERIAL_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen. DO NOT EDIT. Regenerate with scripts/check-cbindgen-serial.sh. */"
cpp_compat = true
style = "type"
documentation = true
documentation_style = "doxy"

[export]
include = [
    "IaxSerial",
    "IaxSerialConfig",
    "IaxKeyLine",
    "IaxRadioLine",
    "IaxRxKeyMode",
]

[enum]
prefix_with_name = true

[parse]
parse_deps = false
