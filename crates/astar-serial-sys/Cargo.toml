[package]
name = "astar-serial-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Poll C-ABI for a cross-platform serial radio-interface client (PTT facet) over astar-ptt. Opaque IaxSerial* handle, integer error codes. Secret-free, no callbacks."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# serial-usb pulls in the raw-USB (nusb) CH343 backend alongside the default tty
# backend; the C-ABI exposes both via IaxSerialConfig.transport. The raw-USB path
# is the sandbox/MAS-eligible one (proven on hardware, iax-ceba/iax-f56c).
astar-ptt = { path = "../astar-ptt", version = "0.1.1-beta", features = ["serial-usb"] }

[dev-dependencies]
# Used directly by the ch34x_usb_spike example (raw-USB CH34x over IOKit).
nusb = "0.2.4"
futures-lite = "2"

# Note: the header is generated by the `cbindgen` CLI (scripts/check-cbindgen-serial.sh),
# not a build.rs, so there is no cbindgen build-dependency here.
