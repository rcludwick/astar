[package]
name = "astar-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Audio I/O for astar. cpal-backed."

[lints]
workspace = true

[features]
default = ["device-audio"]
## Real sound devices through cpal (ALSA on Linux, CoreAudio, WASAPI).
## Default-on; astar-server's single static release turns it off, because a
## headless node uses `NullBackend` and static musl cannot link libasound.
device-audio = ["dep:cpal"]
## Exposes a hardware-free `NullBackend` for downstream tests/examples.
test-backend = []
## A headless `PullBackend` that pulls the output bus on a deadline clock and hands
## the samples to a sink; astar-netrec uses it instead of a sound device.
pull-backend = []
## Derive serde on the secret-free `MicProfile` / `NotchSpec` so a front-end can
## persist a calibrated profile as JSON (iax-2095 / iax-5fb6).
serde = ["dep:serde"]

[dependencies]
cpal = { workspace = true, optional = true }
astar-iax-core = { path = "../astar-iax-core", version = "0.1.21-beta" }
# The adaptive RX jitter buffer (`jitter.rs`, the `jitterbuf.c` port) the output
# mixer plays AllStarLink lanes out of — iax-rxjb. Default features only: no
# codec2, no ambe-hw, so no LGPL and no vocoder driver come along.
astar-codec = { path = "../astar-codec", version = "0.1.21-beta" }
# Read-only recording taps (`Tap`, `TapSlot`, `PcmChunk`). No `writer`
# feature: plain std, no FLAC/tar, nothing heavier on the audio thread.
astar-record = { path = "../astar-record", version = "0.1.21-beta", default-features = false }
mio = { workspace = true }
rubato.workspace = true
rustfft = "6"
nnnoiseless.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Self-reference so this crate's integration tests (tests/*.rs) compile with the
# hardware-free `test_support_router::NullBackend` exposed under `test-backend`
# and serde (for the MicProfile JSON round-trip test).
astar-audio = { path = ".", features = ["test-backend", "serde"] }
serde_json.workspace = true
