<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>astar-server</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>
<div class="ambient ambient-c"></div>
<main>
  <header class="card header">
    <div>
      <h1 id="node-id">node</h1>
      <p class="subtitle">astar-server</p>
    </div>
    <div class="badges">
      <span class="badge off" id="badge-stream"><i class="dot"></i>stream</span>
      <span class="badge off" id="badge-listening"><i class="dot"></i>listening</span>
      <span class="badge off" id="badge-registered"><i class="dot"></i>registered</span>
    </div>
  </header>

  <section class="card">
    <div class="card-head"><h2>Links</h2><span class="count" id="link-count">0</span></div>
    <table>
      <thead><tr><th>node</th><th>mode</th><th>state</th><th>TX</th><th>RX</th><th>up</th><th>addr</th></tr></thead>
      <tbody id="links-body"></tbody>
    </table>
    <p class="empty" id="links-empty">no links</p>
  </section>

  <section class="card">
    <div class="card-head"><h2>Activity</h2><span class="count" id="log-count">0</span></div>
    <ul id="log"></ul>
    <p class="empty" id="log-empty">nothing yet</p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
