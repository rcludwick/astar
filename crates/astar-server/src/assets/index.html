<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>astar-server</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>
<div class="ambient ambient-c"></div>
<main>
  <header class="card header">
    <div>
      <h1 id="node-id">node</h1>
      <p class="subtitle">astar-server · <a class="manage" href="settings">Settings &rarr;</a> · <a class="manage" href="recordings">Recordings &rarr;</a></p>
    </div>
    <div class="badges">
      <span class="badge off" id="badge-stream"><i class="dot"></i>stream</span>
      <span class="badge off" id="badge-listening"><i class="dot"></i>listening</span>
      <span class="badge off" id="badge-registered"><i class="dot"></i>registered</span>
      <span class="badge err" id="badge-m17codec" hidden><i class="dot"></i>M17: no codec</span>
      <div id="auth-chip"></div>
    </div>
  </header>

  <div id="auth-bootstrap" hidden></div>

  <p class="banner warn" id="public-banner" hidden></p>

  <section class="card">
    <div class="card-head"><h2>Links</h2><span class="count" id="link-count">0</span></div>
    <table>
      <thead><tr><th>node</th><th>mode</th><th>state</th><th>TX</th><th>RX</th><th>up</th><th>addr</th></tr></thead>
      <tbody id="links-body"></tbody>
    </table>
    <p class="empty" id="links-empty">no links</p>
  </section>

  <section class="card" id="discord-card" hidden>
    <div class="card-head"><h2>Discord</h2><a class="manage" href="discord/admin">Manage &rarr;</a></div>
    <div class="kv" id="discord-kv"></div>
  </section>

  <section class="card" id="echolink" hidden>
    <div class="card-head"><h2>EchoLink</h2></div>
    <p class="hint" id="echolink-login"></p>
    <table>
      <thead><tr><th>station</th><th>node</th><th>state</th><th>RX</th><th>up</th><th><span class="sr-only">actions</span></th></tr></thead>
      <tbody id="echolink-body"></tbody>
    </table>
    <p class="empty" id="echolink-empty">no stations</p>
    <form class="field-control" id="echolink-dial" autocomplete="off">
      <input type="text" id="echolink-target" maxlength="64" placeholder="Node number or callsign" aria-label="EchoLink node number or callsign" spellcheck="false" autocapitalize="characters">
      <button class="btn" type="submit" id="echolink-go">Dial</button>
    </form>
    <p class="note err" id="echolink-note" role="status" hidden></p>
  </section>

  <section class="card">
    <div class="card-head"><h2>Activity</h2><span class="count" id="log-count">0</span></div>
    <ul id="log"></ul>
    <p class="empty" id="log-empty">nothing yet</p>
  </section>
</main>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
