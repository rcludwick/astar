[package]
name = "astar-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Poll+snapshot C-ABI over the astar-station facade: opaque IaxStation* handle, caller-allocated structs, integer error codes. Secret-free, no callbacks."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
# D-Star is ON by default for the C-ABI (iax-4c8e): the Apple/Swift binding is
# generated straight from this crate, and reaching D-Star from astar is the
# whole point of these entry points. It costs a dongle-free user nothing but a
# serial-port enumeration every 500 ms — `dstar_available` simply reports
# `false`, and every D-Star call fails cleanly.
#
# SAFETY: enabling this unifies `astar-station/dstar` into EVERY crate in
# a workspace build that includes this one — `astar-server` included, which
# exposes remote keying over HTTP. That is exactly why the node's key path
# refuses on the feature-independent `dstar_active` snapshot flag instead of a
# `#[cfg]` (iax-d9f4). Do not weaken that guard on the assumption that the
# node is built without `dstar`: in a workspace build, it is not.
default = ["dstar", "ysf", "m17", "nxdn", "dmr"]
dstar = ["astar-station/dstar"]
# M17, ON by default — it mirrors `astar-station`'s OWN default, so this
# feature does not turn anything on that a plain build did not already have.
# It exists so the M17-shaped entry points (`iax_station_m17_state`) have a
# `#[cfg]` to hang off, exactly as `dstar`/`ysf` do for theirs, instead of
# silently assuming the facade below was built with its default set.
m17 = ["astar-station/m17"]
# System Fusion, ON by default for the same reason `dstar` is: the Swift
# binding is generated from this crate and reaching YSF from astar is the
# point of these entry points. It costs a dongle-free user nothing —
# `ysf_available` reports `false` through the same cached probe `dstar` uses,
# and every YSF call fails cleanly.
#
# SAFETY: the same feature-unification warning applies as for `dstar` above.
# Enabling this turns `astar-station/ysf` on in every crate of a workspace
# build, `astar-server` included. That is why the node's key path refuses on
# the feature-independent `ysf_active` snapshot flag rather than a `#[cfg]`.
ysf = ["astar-station/ysf"]
# NXDN, ON by default for the same reason `dstar` and `ysf` are: the Swift
# binding is generated from this crate and reaching NXDN from astar is the
# point of these entry points. It costs a dongle-free user nothing —
# `nxdn_available` reports `false` through the same cached probe `dstar` and
# `ysf` use, and every NXDN call fails cleanly.
#
# SAFETY: the same feature-unification warning applies as for `dstar` and
# `ysf` above. Enabling this turns `astar-station/nxdn` on in every crate of
# a workspace build, `astar-server` included. That is why the node's key path
# refuses on the feature-independent `nxdn_active` snapshot flag rather than
# a `#[cfg]`.
nxdn = ["astar-station/nxdn"]
# DMR, ON by default for the same reason `dstar`, `ysf` and `nxdn` are: the
# Swift binding is generated from this crate and reaching DMR from astar is
# the point of these entry points. It costs a dongle-free user nothing —
# `dmr_available` reports `false` through the same cached probe the other
# three use, and every DMR call fails cleanly.
#
# SAFETY: the same feature-unification warning applies as for `dstar`, `ysf`
# and `nxdn` above. Enabling this turns `astar-station/dmr` on in every crate
# of a workspace build, `astar-server` included. That is why the node's key
# path refuses on the feature-independent `dmr_active` snapshot flag rather
# than a `#[cfg]`.
dmr = ["astar-station/dmr"]
# Statically-linked Codec 2 for M17 (astar-8c4d). Deliberately NOT default:
# `codec2` is LGPL-2.1-only AND MIT, and a plain `cargo build` of this crate
# must stay free of LGPL code. The macOS app opts in when it builds the
# xcframework; see `LICENSE-EXCEPTIONS.md` for the notices that opt-in carries.
codec2-static = ["astar-station/codec2-static"]

[dependencies]
astar-station = { path = "../astar-station", version = "0.1.12-beta" }
# Serialize the secret-free MicProfile to/from JSON for the characterize /
# set-mic-profile FFI (iax-5fb6 / iax-2095).
serde_json.workspace = true
# Non-elidable scrub of the transient credential-resolver buffer (FFI security
# pass F3).
zeroize.workspace = true

[dev-dependencies]
# The FFI tests build the real station; the test-backend feature keeps any
# device-enumeration path hardware-free.
astar-audio = { path = "../astar-audio", version = "0.1.12-beta", features = [
    "test-backend",
] }

# Note: the header is generated by the `cbindgen` CLI (see
# scripts/check-cbindgen.sh + the `cbindgen` CI job), not a build.rs, so there
# is no `cbindgen` build-dependency here.
