language = "C"
include_guard = "ASTAR_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen. DO NOT EDIT. Regenerate with scripts/check-cbindgen.sh. */"
cpp_compat = true
style = "type"
documentation = true
documentation_style = "doxy"

[export]
# The Rust types are already named Iax* / IAX_*, so no extra prefix is added.
include = [
    "IaxStation",
    "IaxConfig",
    "IaxState",
    "IaxEvent",
    "IaxStatus",
    "IaxEventKind",
    "IaxMode",
    "IaxAnswerPolicy",
    "IaxAuthPolicy",
    "IaxNodeConfig",
    "IaxCredentialResolver",
]

[enum]
prefix_with_name = true

[parse]
parse_deps = false
