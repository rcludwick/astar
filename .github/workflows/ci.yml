# ============================================================================
# astar CI — runs on the self-hosted IONOS box (`my-vps`).
#
# TWO REPOSITORIES, AND WHY THIS FILE CHECKS WHICH ONE IT IS IN
# -------------------------------------------------------------
# astar lives in two places:
#
#   rcludwick/astar-private   PRIVATE   development happens here; CI runs here
#   rcludwick/astar           PUBLIC    release target, merged to from private
#
# The self-hosted runner is attached to the PRIVATE repository only. That is
# the whole security design: a self-hosted runner on a public repo would let
# any stranger's fork execute arbitrary code as the `github` user on a box that
# also hosts runners for other repositories. On a private repo there are no
# outside contributors to defend against — only people who already have access.
#
#   THE PUBLIC REPOSITORY MUST NEVER HAVE A SELF-HOSTED RUNNER ATTACHED.
#   DO NOT ADD `pull_request` OR `pull_request_target` TO THIS FILE.
#
# This file rides along into the public repository on every release merge, and
# `runs-on: [self-hosted, ionos]` there would queue forever against a runner
# that does not exist — which looks like a hung box rather than a
# misconfiguration. Every job is therefore guarded on `github.repository`, so
# in the public repo the workflow reports a clean skip instead.
#
# On top of that, the only trigger is `workflow_dispatch`: CI runs when Rob
# asks for it and at no other time. The box is small and a full Rust build is
# not free, so CI here is an act, not a reflex.
#
# If PR checks are ever wanted on the public repo, the answer is a separate
# workflow pinned to `runs-on: ubuntu-latest` — GitHub-hosted minutes are free
# for public repos — and never a self-hosted runner.
#
# WHAT THIS DOES NOT COVER
# ------------------------
# The Swift half — the macOS app, both bindings, `swift format` — cannot run
# here: the box is Debian x86-64 with no Xcode. That gate is `just ci-full` on
# a Mac, run by hand. See ci/README.md, which is honest about the hole.
#
# The runner image is built from `rcludwick/gh-runners` (`runner/Containerfile`)
# and already carries the toolchain; jobs install nothing except `cbindgen`,
# which is cached in the container's CARGO_HOME after the first run.
# ============================================================================

name: ci

on:
  workflow_dispatch:
    inputs:
      run_gui:
        description: "Include the Iced client job (slow: iced/wgpu on a 3 GB box)"
        type: boolean
        default: true
      run_nodebench:
        description: "Include nodebench (needs the runner changes in harness/nodebench/README.md, CI)"
        type: boolean
        default: false
      nodebench_scenarios:
        description: "nodebench scenario ids, space-separated (empty = the whole quick tier)"
        type: string
        default: ""
      nodebench_hold_secs:
        description: "nodebench hold window for the 'link holds' checks, seconds"
        type: string
        default: "60"

# One run at a time per branch. Dispatching again supersedes a run still
# queued behind the first — the box has 4 cores and 3 GB of RAM, so
# overlapping Rust builds are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail a build rather than let a warning through, matching `just ci`.
  RUSTFLAGS: -D warnings

jobs:
  # Cheapest job, and the one that catches what a test cannot. Runs first so a
  # policy violation does not wait behind a full Rust build.
  guards:
    # Private repo only — see the header. Skips cleanly in public.
    if: github.repository == 'rcludwick/astar-private'
    runs-on: [self-hosted, ionos]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Keep this list in step with the `guards` recipe in the justfile. Two
      # of these were written and then never added here, so the invariant
      # they enforce held only on whichever Mac last ran `just guards`:
      # guard-codec2-licensing.sh (no LGPL in a default build) and
      # guard-discord-feature.sh (no tokio/songbird in a default build).
      - name: Merge invariants
        run: |
          ./ci/guard-safety-env.sh
          ./ci/guard-no-git-deps.sh
          ./ci/guard-distribution-claims.sh
          ./ci/guard-spdx-headers.sh
          ./ci/guard-codec2-licensing.sh
          ./ci/guard-dstar-soft-ambe.sh
          ./ci/guard-discord-feature.sh
          ./ci/guard-no-tiny-http.sh
          ./ci/guard-echolink.sh
          ./ci/guard-packet-log.sh
          ./ci/guard-netrec-receive-only.sh

  # The `just ci` equivalent. `just` is deliberately not installed on the box,
  # so the recipes are spelled out; keep the two in step by hand.
  rust:
    # Private repo only — see the header. Skips cleanly in public.
    if: github.repository == 'rcludwick/astar-private'
    runs-on: [self-hosted, ionos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the whole suite in parallel, the M17 parrot test included. That
      # test no longer asserts a wall-clock cadence ceiling (iax-f7a3 — the
      # cadence is pinned by unit tests on `next_read_timeout` instead), only a
      # floor proving playback is paced rather than blasted. Load can make a
      # floor easier to clear, never harder, so it needs no isolation here.
      - name: Test
        run: cargo test --workspace --all-targets

      # astar-codec's opt-in `gsm` feature, which the default-features clippy
      # and test above never compile. Mirrors `just gsm-check`. The ETSI test
      # skips here (no ASTAR_GSM_ETSI_DIR); the golden-frame test runs.
      - name: GSM 06.10 (--features gsm)
        run: |
          cargo clippy -p astar-codec --all-targets --features gsm -- -D warnings
          cargo test -p astar-codec --features gsm
      # The software D-Star vocoder (astar-dstar-perens), off by default.
      # Mirrors `just soft-ambe-check`.
      - name: Software D-Star vocoder (--features dstar-soft-ambe)
        run: |
          cargo clippy -p astar-codec -p astar-console -p astar-station -p astar-sys -p astar-server --all-targets --features astar-codec/dstar-soft-ambe,astar-console/dstar,astar-console/dstar-soft-ambe,astar-station/dstar-soft-ambe,astar-sys/dstar-soft-ambe,astar-server/dstar-soft-ambe -- -D warnings
          cargo test -p astar-codec --features dstar-soft-ambe --lib
          cargo test -p astar-console --features dstar,dstar-soft-ambe --lib -- software_ dstar_vocoder
          cargo test -p astar-sys --features dstar-soft-ambe --lib -- dstar_vocoder
          cargo test -p astar-server --features dstar-soft-ambe --lib -- vocoder
          cargo clippy -p astar-netrec --all-targets --features release -- -D warnings
          cargo test -p astar-netrec --features release
          ./ci/guard-dstar-soft-ambe.sh

      # Pinned: different cbindgen releases format headers differently, and a
      # mismatch reads as spurious drift in a committed header.
      - name: cbindgen (cached in CARGO_HOME after the first run)
        run: |
          need=0.29.4
          have=$(cbindgen --version 2>/dev/null | awk '{print $2}') || true
          if [ "$have" != "$need" ]; then
            cargo install cbindgen --version "$need" --locked
          fi

      - name: C header drift
        run: |
          ./scripts/check-cbindgen.sh
          ./scripts/check-cbindgen-serial.sh

  # The Discord bridge, which the `rust` job above cannot see: `discord` is off
  # by default (guard-discord-feature.sh proves it), so a default-features
  # clippy and test compile none of crates/astar-discord/src/songbird_link.rs,
  # none of astar-server's `#[cfg(feature = "discord")]` items, and none of the
  # feature-gated tests. That is several hundred lines with no automated gate
  # at all — while the released astar-server container IS built with
  # `--features discord` (LICENSE-EXCEPTIONS.md §4), so this is shipped code.
  #
  # Its OWN job, not extra steps on `rust`: the feature resolves ~200 packages
  # more than a default build (songbird, serenity, tokio and their trees), and
  # folding that in would put the cbindgen/header-drift gate behind a second
  # heavy compile on a 4-core box. Separate, it runs in parallel and a failure
  # names itself.
  discord:
    # Private repo only — see the header. Skips cleanly in public.
    if: github.repository == 'rcludwick/astar-private'
    runs-on: [self-hosted, ionos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clippy (--features discord)
        run: |
          cargo clippy -p astar-server -p astar-discord --all-targets \
            --features discord -- -D warnings

      - name: Test (--features discord)
        run: |
          cargo test -p astar-discord --features discord
          cargo test -p astar-server  --features discord

  # astar-server's opt-in `dns-providers` feature (the extra DNS providers),
  # which a default-features clippy and test never compile. The release build
  # has it. Mirrors `just dns-check`; its tests use only in-memory fakes and
  # 127.0.0.1.
  dns-providers:
    # Private repo only — see the header. Skips cleanly in public.
    if: github.repository == 'rcludwick/astar-private'
    runs-on: [self-hosted, ionos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clippy (--features dns-providers)
        run: |
          cargo clippy -p astar-server --all-targets \
            --features dns-providers -- -D warnings

      - name: Test (--features dns-providers)
        run: |
          cargo test -p astar-server --features dns-providers --lib -- public::
          cargo test -p astar-server --features dns-providers --lib -- config::

  # The feature matrix (ci/feature-matrix.sh, `just feature-matrix`): every
  # crate built alone with --all-features and with each feature on its own,
  # where the workspace-unified build in the `rust` job cannot see a crate
  # that forgot to ask for a feature it uses. Full tests for astar-cli,
  # astar-console and astar-server under --all-features and without `stream`,
  # and astar-server's `release` set natively.
  #
  # Its OWN job: about a hundred clippy runs plus the discord, LAME and Codec 2
  # trees, far heavier than `rust`, and a failure here should name itself
  # rather than hold up the header-drift gate. The script runs every step and
  # lists the failures at the end, so one run reports all of them.
  feature-matrix:
    # Private repo only — see the header. Skips cleanly in public.
    if: github.repository == 'rcludwick/astar-private'
    runs-on: [self-hosted, ionos]
    timeout-minutes: 120
    env:
      # The discord and release steps compile songbird, LAME and rustls; on a
      # 3.8 GB box unbounded codegen beside them can OOM the linker.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Feature matrix
        run: ./ci/feature-matrix.sh

  # --strict, so a broken link or a nav entry pointing at a missing page fails
  # here instead of failing the manual Pages publish later. Same script the
  # Pages workflow runs.
  docs:
    # Private repo only — see the header. Skips cleanly in public.
    if: github.repository == 'rcludwick/astar-private'
    runs-on: [self-hosted, ionos]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the documentation site
        run: ./ci/build-docs.sh

  # RustSec advisory check over the committed Cargo.lock. Complements Dependabot
  # rather than duplicating it: Dependabot watches the dependency graph and opens
  # PRs on its own schedule, while this fails a run, so an advisory cannot ride
  # along unnoticed in a release build.
  #
  # `continue-on-error`, deliberately. A new advisory against a transitive crate
  # appears without anyone touching this repository, and a red CI that nobody
  # caused teaches people to ignore red CI. The result is visible in the run
  # summary and in `just audit` locally; promote it to a hard gate if that turns
  # out to be too quiet.
  audit:
    # Private repo only — see the header. Skips cleanly in public.
    if: github.repository == 'rcludwick/astar-private'
    runs-on: [self-hosted, ionos]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: cargo-audit (cached in CARGO_HOME after the first run)
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
      - name: Advisory scan
        run: cargo audit --deny warnings

  # The Iced client. On the Mac `just gui-linux` reaches Linux through podman;
  # here the box IS Linux, so it builds natively and the headless run is a
  # plain xvfb-run.
  gui-linux:
    if: github.repository == 'rcludwick/astar-private' && inputs.run_gui
    runs-on: [self-hosted, ionos]
    timeout-minutes: 60
    env:
      # iced/wgpu is the heaviest thing in the tree and this box has 3 GB.
      # Unbounded codegen parallelism OOMs the linker here.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test astar-gui
        run: |
          cargo build -p astar-gui
          cargo test  -p astar-gui

      # Proves it renders, not merely that it links. Mirrors what
      # apps/gui/check-linux.sh does inside podman on the Mac: the software
      # renderer (this box has no GPU), a virtual X server, and a hard timeout
      # so a hung window manager cannot occupy the runner for an hour.
      - name: Headless render
        working-directory: apps/gui
        env:
          ICED_BACKEND: tiny-skia
        run: |
          mkdir -p .shots
          timeout 120 xvfb-run -a \
            ../../target/debug/astar-gui --shot idle .shots/linux-idle.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-linux-shot
          path: apps/gui/.shots/linux-idle.png
          if-no-files-found: warn

  # nodebench: astar-server against a real AllStarLink 3 node in a podman pod
  # (harness/nodebench/README.md). No radio exists in the rig, every service
  # talks on 127.0.0.1 inside one pod, and every published port is on the
  # runner container's own 127.0.0.1.
  #
  # OFF BY DEFAULT (`run_nodebench`), because the runner cannot run it yet:
  # the image has no podman, and the runner container is created with
  # podman's default confinement, under which a nested rootless podman cannot
  # even set up its user namespace. README.md "CI" lists exactly what the
  # runner needs; `harness/nodebench/ci/nested-trial.sh` proves that recipe on
  # the Mac by running the rig inside a stand-in of the runner image.
  # Until the box has it, the preflight step below fails with that pointer
  # rather than letting the job pretend.
  #
  # It does not gate the others (no `needs:`), and the quick tier currently
  # FAILS on known, still-open astar-server bugs (harness/nodebench/RIG.md,
  # findings 2, 3 and 6-8). Red here is the bench doing its job.
  nodebench:
    if: github.repository == 'rcludwick/astar-private' && inputs.run_nodebench
    runs-on: [self-hosted, ionos]
    # The full quick tier with 60 s holds has not been timed end to end yet
    # (several scenarios hold 60 s each, and codec_matrix links 24 times);
    # the two images, a release build of astar-server among them, add more
    # on a cold cache. 90 minutes is a ceiling, not an estimate.
    timeout-minutes: 90
    env:
      # The box has 3.8 GB; the astar-server image build and the host build
      # of the bench must not run unbounded codegen side by side.
      CARGO_BUILD_JOBS: "2"
      # Inside the runner, podman is local. Never inherit a remote connection.
      CONTAINER_CONNECTION: ""
      # Where a pod reaches the runner container's 127.0.0.1 (slirp4netns
      # with allow_host_loopback=true). The node's USRP transmit audio comes
      # back to the bench here; host.containers.internal would name the box.
      NODEBENCH_USRP_HOST: "10.0.2.2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preflight (nested rootless podman)
        run: |
          fail() {
            echo "::error::nodebench: $1. The runner needs the changes in harness/nodebench/README.md (CI)."
            exit 1
          }
          command -v podman >/dev/null 2>&1 || fail "podman is not installed in the runner image"
          podman --version
          podman info --format 'store={{.Store.GraphDriverName}} net={{.Host.NetworkBackend}}' \
            || fail "podman cannot start here (user namespace or storage)"
          podman run --rm docker.io/library/busybox:1.36 true \
            || fail "a nested container will not start (devices, seccomp or /proc masks)"

      - name: Build the rig images
        run: harness/nodebench/rig.sh build

      # Inputs arrive through env and are checked, never pasted into the
      # script, so a dispatch input cannot become shell.
      - name: Quick tier
        env:
          NB_SCENARIOS: ${{ inputs.nodebench_scenarios }}
          NB_HOLD: ${{ inputs.nodebench_hold_secs }}
        run: |
          [[ "$NB_HOLD" =~ ^[0-9]+$ ]] || { echo "::error::hold secs must be a number: $NB_HOLD"; exit 2; }
          [[ "$NB_SCENARIOS" =~ ^[a-z0-9_\ ]*$ ]] || { echo "::error::scenario ids are [a-z0-9_]"; exit 2; }
          read -r -a scenarios <<<"$NB_SCENARIOS"
          cargo run -q --locked -p astar-nodebench -- run \
            --replace \
            --hold-secs "$NB_HOLD" \
            --var "USRP_HOST=$NODEBENCH_USRP_HOST" \
            "${scenarios[@]}"

      # report.json, per-scenario last-frames.txt and log tails, the pcap ring.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodebench-report
          path: target/nodebench/
          if-no-files-found: warn

      - name: Tear the rig down
        if: always()
        run: harness/nodebench/rig.sh down || true
