# ============================================================================
# CodeQL static analysis. Runs ONLY in the public repository.
#
# WHY PUBLIC ONLY, AND WHY THAT IS NOT A CHOICE
# ---------------------------------------------
# GitHub code scanning on a *private* repository requires GitHub Advanced
# Security, which a personal account cannot buy. `rcludwick/astar-private`
# answers the code-scanning API with 403 "Code scanning is not enabled" and no
# setting changes that. So this file is guarded on `github.repository` exactly
# like ci.yml and docs-pages.yml — it rides along into the private repo on every
# push and skips cleanly there rather than failing every run.
#
# The private repo is not left unwatched: it runs the `audit` job in ci.yml
# (RustSec advisories over Cargo.lock) and has Dependabot alerts enabled.
#
# RUNNER
# ------
# `ubuntu-latest`, never self-hosted. Actions minutes are free on public repos,
# and a self-hosted runner on a public repo would hand any fork's pull request
# arbitrary code execution on the IONOS box. See ci.yml's header — that rule is
# absolute and this file does not bend it.
#
# SCOPE
# -----
# Rust only. The Swift app is not analysed here: CodeQL's Swift support needs a
# macOS runner and a full Xcode build, which is the `just ci-full` gate on a Mac.
# ============================================================================

name: codeql

on:
  push:
    branches: [main]
  schedule:
    # Weekly. New queries ship on CodeQL's own cadence, so a periodic run finds
    # things a push-triggered run cannot — the code need not change for the
    # analysis of it to improve.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Public repo only — see the header. Skips cleanly in private.
    if: github.repository == 'rcludwick/astar'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # cpal's Linux backend builds against ALSA, so `alsa-sys` needs the dev
      # headers. ubuntu-latest does not ship them, which failed every run of
      # this workflow from the day it was added — `pkg-config --libs alsa`
      # exits 1 and alsa-sys panics in its build script. macOS builds never hit
      # this (cpal uses CoreAudio there), so it is invisible to `just ci`.
      - name: System libraries for the cpal ALSA backend
        # Bounded on purpose. The first version of this step had no timeout, and
        # when azure.archive.ubuntu.com went unreachable the run sat in apt's
        # retry backoff (Ign: ... Ign: ...) for 25 minutes against a 60-minute
        # job budget. A mirror outage should cost a fast, readable failure, not
        # an hour of a hung runner.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          # `|| true`: the runner image ships recent package lists, so the
          # install below usually succeeds without a refresh. A flaky mirror
          # should not be the thing that fails CodeQL — let the install be the
          # step that decides, since it is the one we actually care about.
          sudo apt-get update -o Acquire::Retries=2 || echo "apt-get update failed; trying the install against the image's existing lists"
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 libasound2-dev
          # Prove the headers landed, so a future failure names itself here
          # rather than 200 lines into a cargo build script panic.
          pkg-config --modversion alsa

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Build
        # The engine only. apps/gui pulls iced/wgpu and a pile of system
        # libraries that are not worth installing on a hosted runner just to
        # analyse them; the protocol, codec, audio and PTT code is what matters.
        run: cargo build --locked -p astar-station -p astar-iax -p astar-m17 -p astar-dstar

      - name: Analyze
        uses: github/codeql-action/analyze@v3
