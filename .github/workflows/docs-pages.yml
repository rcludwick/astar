# ============================================================================
# Publishes the Zensical documentation to GitHub Pages. This is the ONLY thing
# that runs in the public repository.
#
# WHERE IT RUNS, AND WHERE IT MUST NOT
# ------------------------------------
# astar develops in the PRIVATE `rcludwick/astar-private` and releases to the
# PUBLIC `rcludwick/astar`. Both workflow files exist in both repositories,
# because a release merge copies everything, so both jobs below are guarded on
# `github.repository`:
#
#   this file    does work ONLY in rcludwick/astar          (Pages lives there)
#   ci.yml       does work ONLY in rcludwick/astar-private  (the runner lives there)
#
# In the private repo this workflow still *starts* on a push to main and then
# skips both jobs immediately. That is intentional and cheap — a skipped job
# occupies no runner — and it beats the alternative, which is a Pages deploy
# attempt against a repository that has no Pages site and a 404 from the API.
#
# TRIGGERS
# --------
# `push` to main, path-filtered, plus a manual button. Publishing follows a
# merge to the public repo rather than waiting for someone to remember; the
# path filter keeps an engine-only release from rebuilding a site that did not
# change. Nothing else triggers it — no pull_request, no schedule.
#
# It runs on GitHub-hosted `ubuntu-latest`, never a self-hosted runner. That is
# not negotiable in a public repo: see ../../ci/README.md.
#
# BEFORE THE FIRST RUN, one manual setting: repository Settings → Pages →
# Build and deployment → Source = "GitHub Actions". Without it deploy-pages
# fails with a 404 on the Pages API. `site_url` in zensical.toml already
# carries the /astar/ project sub-path Pages serves from; if the repository is
# ever renamed, that value has to move with it or instant navigation and the
# 404 page will resolve against the wrong origin.
#
# RUNNER CHOICE, AND THE SECURITY TRADE BEHIND IT
# -----------------------------------------------
# This runs on GitHub-hosted `ubuntu-latest`, not on the self-hosted IONOS
# fleet, and that is deliberate:
#
#   * GitHub Pages on a *private* repo requires a paid plan, so publishing at
#     all implies this repo is public. Actions minutes on public repos are
#     free, so ubuntu-latest costs nothing here.
#   * A self-hosted runner must NEVER be attached to a public repo — any pull
#     request author would get arbitrary code execution on the build box and,
#     for the macOS runners, on Rob's personal Mac. The gh-runners README says
#     this in bold and it is right.
#
# That was settled on 2026-08-13: no self-hosted runner is attached to this
# repository, and the development runner lives on the private one instead.
# Confirm with `gh api repos/rcludwick/astar/actions/runners --jq .total_count`,
# which must stay 0.
#
# The build is a thin wrapper around ci/build-docs.sh — the same script the
# GitLab `docs-site` job runs, so the published site and the CI-verified site
# are built by identical code.
# ============================================================================

name: docs (Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "zensical.toml"
      - "ci/build-docs.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

# Least privilege: read the tree, write a Pages deployment, mint the OIDC token
# deploy-pages needs. No contents: write, no packages, no PR access.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a publish midway.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # PUBLIC repo only. GitHub Pages is enabled there, not on the private
    # development repo this file also lives in — dispatching it from
    # astar-private would 404 on the Pages API.
    if: github.repository == 'rcludwick/astar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/configure-pages@v5

      # Reads zensical.toml at the repo root; output lands in site_dir
      # (docs/.site). Builds with --strict, so a broken link fails the publish
      # rather than shipping a half-built site.
      - name: Build the Zensical site
        run: ./ci/build-docs.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.site

  deploy:
    needs: build
    if: github.repository == 'rcludwick/astar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
